# ebuild-updater configuration for haven-overlay.
#
# This file lives at the overlay root so it travels with the overlay git tree.
#
# THERE IS NO HOLD LIST HERE, DELIBERATELY.
#
# The effective hold for dev-util/opencode-plugin-swarm — and for every other
# held atom — is the *global* `[pipeline]` table in
# /etc/ebuild-updater/config.toml (`hold = [` at line 22).
#
# Two scheduled drivers run the updater, and neither consults a repo-scoped
# hold:
#
#   03:00  /root/scripts/ebuild-updater-nightly.sh
#            cd /var/db/repos/haven-overlay                      (line 15)
#            /usr/bin/ebuild-updater --overlay /var/db/... \
#                pipeline --commit --reinstall --json-log        (line 32)
#          This file *is* a base source for that run (the cwd entry,
#          config.py:37), but --overlay makes resolve_repos() return a
#          transient RepoConfig with pipeline=None (config.py:858-867), so
#          [repos.haven-overlay] is bypassed.
#
#   ~03:27 /etc/cron.daily/ebuild-updater
#            ebuild-updater --config /etc/ebuild-updater/config.toml pipeline
#          --config makes /etc the only base source (config.py:745-747), so
#          this file is not read at all.
#
# A `[repos.haven-overlay.pipeline] hold = [...]` band used to live here. It was
# inert on both drivers. It would only become live on a manual run from the
# overlay root with *neither* --config nor --overlay — and then it would replace
# the /etc list wholesale (config.py:649-666: list values are replaced, not
# unioned), producing a second pin to keep in sync for no operational gain.
# Removed 2026-11-16.
#
# Provenance and the hold-release procedure:
# packaging/ebuild/README-retention-patch.md in ai-ml/way-of-work.
#
# Compatibility: ebuild-updater's [repos.<name>] form is the v2.x multi-repo
# shape (see docs/project/spec_multirepo.md). This is exactly equivalent to the
# legacy top-level [overlay] form for the canonical haven-overlay repo.

[repos.haven-overlay]
path    = "/var/db/repos/haven-overlay"
enabled = true
